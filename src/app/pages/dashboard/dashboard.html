<section class="dashboard">

    <div class="dashboard-header">
      <h1>Dashboard</h1>
      <p>Track your job search progress.</p>
    </div>
  
    <div class="stats-grid">
  
        <div class="stats-grid">

            @for (stat of stats; track stat.label) {
        
              <div class="stat-card">
                <p class="stat-label">{{ stat.label }}</p>
                <h2>{{ stat.value }}</h2>
              </div>
  
            }
        </div>
  
    </div>
  
  </section>
